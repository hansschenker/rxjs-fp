<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rxjs-fp · Todo CRUDL</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #ddd; --accent: #2b6cb0; --card: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --line: #333; --accent: #7fb0ea; --card: #20201f; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      p.lede { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
      form input { width: 100%; padding: 12px 14px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
      ul.todos { list-style: none; padding: 0; margin: 16px 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
      ul.todos li { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
      ul.todos li:first-child { border-top: 0; }
      li.done .title { text-decoration: line-through; color: var(--muted); }
      li.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
      li.empty { color: var(--muted); }
      .title { flex: 1; cursor: pointer; }
      input.edit { flex: 1; font: inherit; padding: 4px 6px; }
      button { font: inherit; font-size: 0.85rem; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      button.on { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 0.9rem; }
      footer .filters { display: inline-flex; gap: 4px; margin-left: auto; }
      aside.detail { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
      aside.detail h2 { margin: 0; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo CRUDL</h1>
      <p class="lede">rxjs-fp · intents → reducers → <code>merge</code> → <code>scan</code> → view</p>
      <form id="new-todo"><input placeholder="What needs to be done?" autocomplete="off" aria-label="New todo" /></form>
      <div id="app"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
